apiVersion: v1
kind: Service   
metadata:
  name: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.otelcollector.servicePort1 }}
      targetPort: {{ .Values.otelcollector.targetPort1 }}
    - name: grpc
      protocol: TCP
      port: {{ .Values.otelcollector.servicePort2 }}
      targetPort: {{ .Values.otelcollector.targetPort2 }}
    - name: oltp
      protocol: TCP
      port: {{ .Values.otelcollector.servicePort3 }}
      targetPort: {{ .Values.otelcollector.targetPort3 }}
  type: NodePort