apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  selector:
    app: tempo
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.tempo.servicePort1 }}
      targetPort: {{ .Values.tempo.targetPort1 }}
    - name: oltp
      protocol: TCP
      port: {{ .Values.tempo.servicePort2 }}
      targetPort: {{ .Values.tempo.targetPort2 }}
  type: NodePort