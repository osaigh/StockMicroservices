{{- if .Values.stockwebclient.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stockwebclient-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stockwebclient
  minReplicas: {{ .Values.stockwebclient.hpa.minReplicas }}
  maxReplicas: {{ .Values.stockwebclient.hpa.maxReplicas }}
  metrics:
    {{- if .Values.stockwebclient.hpa.cpu.targetUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.stockwebclient.hpa.cpu.targetUtilizationPercentage }}
    {{- end }}
    {{- if .Values.stockwebclient.hpa.memory.targetUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.stockwebclient.hpa.memory.targetUtilizationPercentage }}
    {{- end }}
{{- end }}
