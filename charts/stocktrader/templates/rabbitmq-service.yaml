apiVersion: v1
kind: Service   
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
  - name: default
    protocol: TCP
    port: {{ .Values.rabbitmq.port1 | default 5672 }}
    targetPort: {{ .Values.rabbitmq.port1 | default 5672 }}
  - name: admin
    protocol: TCP
    port: {{ .Values.rabbitmq.port2 | default 15672 }}
    targetPort: {{ .Values.rabbitmq.port2 | default 15672 }}
  type: NodePort