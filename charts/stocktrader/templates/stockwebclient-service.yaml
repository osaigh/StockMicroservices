apiVersion: v1
kind: Service   
metadata:
  name: stockwebclient
spec:
  selector:
    app: stockwebclient
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.stockwebclient.servicePort | default 44100 }}
      targetPort: {{ .Values.stockwebclient.targetPort | default 80 }}
  type: NodePort