name: Provision AKS and argocd

on:
  push:
    branches:
      - gitops
  workflow_dispatch:

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}

jobs:
  provision-aks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: |
          cd iac/azure
          pwd
          terraform init

      - name: Terraform Apply
        run: |
          cd iac/azure
          pwd
          echo "Using ARM_CLIENT_ID: $ARM_CLIENT_ID"
          echo "Using ARM_CLIENT_SECRET: $ARM_CLIENT_SECRET"
          echo "Using ARM_SUBSCRIPTION_ID: $ARM_SUBSCRIPTION_ID"
          echo "Using ARM_TENANT_ID: $ARM_TENANT_ID"
          echo "$GITHUB_WORKSPACE/iac/azure/vars/input.tfvars"
          terraform apply -auto-approve -var-file="$GITHUB_WORKSPACE/iac/azure/vars/input.tfvars"

      - name: Get AKS credentials
        run: |
          az login --service-principal -u $ARM_CLIENT_ID -p $ARM_CLIENT_SECRET --tenant $ARM_TENANT_ID
          az aks get-credentials --resource-group $RESOURCE_GROUP_NAME --name $AKS_CLUSTER_NAME --overwrite-existing

      - name: Install Kubectl
        run: |
          az aks install-cli

      - name: Deploy Argo CD to AKS
        run: |
          kubectl apply -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          echo "Waiting for Argo CD server..."
          kubectl apply -f argocd-service-patch.yaml
          