apiVersion: v1
kind: Service
metadata:
  name: stockapi
  labels:
    app: stockapi
    app.kubernetes.io/part-of: stockmicroservices
spec:
  selector:
    app: stockapi
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockapi
  labels:
    app: stockapi
    app.kubernetes.io/part-of: stockmicroservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockapi
  template:
    metadata:
      labels:
        app: stockapi
    spec:
      containers:
        - name: stockapi
          image: stockapi:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              value: http://+:80
            - name: IdentityServerUrl
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: IdentityServerUrl
            - name: APIScope
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: ApiScope
            - name: Cors__AllowedOrigins__0
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: CorsAllowedOrigin
            - name: RabbitMq__Hostname
              value: rabbitmq
            - name: RabbitMq__Port
              value: "5672"
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: stock-secret
                  key: rabbitmq-username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: stock-secret
                  key: rabbitmq-password
            - name: Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: stock-secret
                  key: mongo-connection-string
            - name: Database__Name
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: DatabaseName
            - name: Database__SeedOnStartup
              value: "true"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
