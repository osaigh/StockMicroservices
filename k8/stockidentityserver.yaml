apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-keys
  labels:
    app: stockidentityserver
    app.kubernetes.io/part-of: stockmicroservices
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stockidentityserver
  labels:
    app: stockidentityserver
    app.kubernetes.io/part-of: stockmicroservices
spec:
  selector:
    app: stockidentityserver
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockidentityserver
  labels:
    app: stockidentityserver
    app.kubernetes.io/part-of: stockmicroservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockidentityserver
  template:
    metadata:
      labels:
        app: stockidentityserver
    spec:
      containers:
        - name: stockidentityserver
          image: stockidentityserver:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              value: http://+:80
            - name: WebClientUrl
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: WebClientUrl
            - name: WebClientDevUrl
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: WebClientDevUrl
            - name: Cors__AllowedOrigins__0
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: CorsAllowedOrigin
            - name: IdentityServer__DataProtectionPath
              value: /app/keys
            - name: IdentityServer__IssuerUri
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: IdentityServerIssuer
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: identity-keys
              mountPath: /app/keys
      volumes:
        - name: identity-keys
          persistentVolumeClaim:
            claimName: identity-keys
