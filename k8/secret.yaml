# Development defaults. Change these values before deploying anywhere real.
# Prefer creating this Secret from your secret manager and deleting this file
# from source control for non-demo environments.
apiVersion: v1
kind: Secret
metadata:
  name: stock-secret
  labels:
    app.kubernetes.io/part-of: stockmicroservices
type: Opaque
stringData:
  mongo-root-username: root
  mongo-root-password: admin1
  mongo-connection-string: mongodb://root:admin1@mongo:27017/?authSource=admin
  rabbitmq-username: user
  rabbitmq-password: password
  rabbitmq-erlang-cookie: stockmicroservices-cookie
