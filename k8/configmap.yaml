apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-config
  labels:
    app.kubernetes.io/part-of: stockmicroservices
data:
  ASPNETCORE_ENVIRONMENT: Production
  WebClientUrl: http://localhost:44100
  WebClientDevUrl: http://localhost:3000
  IdentityServerUrl: http://stockidentityserver
  ApiScope: StockMicroservicesAPI
  CorsAllowedOrigin: http://localhost:44100
  IdentityServerIssuer: http://localhost:44401
  DatabaseName: stocks
