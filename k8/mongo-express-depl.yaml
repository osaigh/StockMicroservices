apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
spec:
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
      - name: mongo-express
        image: mongo-express
        env:
          - name: ME_CONFIG_MONGODB_ADMINUSERNAME
            valueFrom:
              secretKeyRef:
                name: stock-secret
                key: mongo_admin_user
          - name: ME_CONFIG_MONGODB_ADMINPASSWORD
            valueFrom:
              secretKeyRef:
                name: stock-secret
                key: mongo_admin_password
          - name: ME_CONFIG_MONGODB_URL
            valueFrom:
              secretKeyRef:
                name: stock-secret
                key: mongo_connectionstring
        ports:
        - containerPort: 8081
