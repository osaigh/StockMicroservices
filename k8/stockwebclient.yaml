apiVersion: v1
kind: Service
metadata:
  name: stockwebclient
  labels:
    app: stockwebclient
    app.kubernetes.io/part-of: stockmicroservices
spec:
  selector:
    app: stockwebclient
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockwebclient
  labels:
    app: stockwebclient
    app.kubernetes.io/part-of: stockmicroservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockwebclient
  template:
    metadata:
      labels:
        app: stockwebclient
    spec:
      containers:
        - name: stockwebclient
          image: stockwebclient:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
