apiVersion: v1
kind: Service
metadata:
  name: stockapigateway
  labels:
    app: stockapigateway
    app.kubernetes.io/part-of: stockmicroservices
spec:
  selector:
    app: stockapigateway
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockapigateway
  labels:
    app: stockapigateway
    app.kubernetes.io/part-of: stockmicroservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockapigateway
  template:
    metadata:
      labels:
        app: stockapigateway
    spec:
      containers:
        - name: stockapigateway
          image: stockapigateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              value: http://+:80
            - name: IdentityServerUrl
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: IdentityServerUrl
            - name: APIScope
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: ApiScope
            - name: Cors__AllowedOrigins__0
              valueFrom:
                configMapKeyRef:
                  name: stock-config
                  key: CorsAllowedOrigin
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
