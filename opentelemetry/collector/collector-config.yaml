receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
exporters:
  debug:
  otlphttp/logs:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true  
  otlphttp/traces:
    endpoint: "http://tempo:7778"
  prometheus:
    endpoint: 0.0.0.0:7777

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/traces, debug]
    metrics:
      receivers: [otlp]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      exporters: [otlphttp/logs, debug]